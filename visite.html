<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Marcuzzi — Visite immersive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root { --or:#C9A96E; --txt:#F0EBE1; }
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden;cursor:none}
body{background:#060402;font-family:Georgia,'Times New Roman',serif;color:var(--txt);-webkit-font-smoothing:antialiased}

/* ── CURSOR ── */
#cr{position:fixed;width:46px;height:46px;border:1px solid rgba(201,169,110,.55);border-radius:50%;pointer-events:none;z-index:9999;top:0;left:0;will-change:transform}
#cd{position:fixed;width:5px;height:5px;background:var(--or);border-radius:50%;pointer-events:none;z-index:9999;top:0;left:0;will-change:transform}

/* ── PROGRESS ── */
#pb{position:fixed;top:0;left:0;height:1.5px;width:100%;background:var(--or);transform-origin:left;transform:scaleX(0);z-index:400;pointer-events:none}

/* ── LOGO ── */
#logo{position:fixed;top:30px;left:38px;z-index:400;pointer-events:none;mix-blend-mode:normal}
#logo-name{display:block;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;font-weight:normal;color:var(--txt);line-height:1}
#logo-sub{display:block;font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;color:var(--or);margin-top:5px;font-family:system-ui,sans-serif}

/* ── COUNTER ── */
#ctr{position:fixed;top:33px;right:52px;z-index:400;font-family:system-ui,sans-serif;font-size:.58rem;letter-spacing:.16em;color:rgba(201,169,110,.65);pointer-events:none;opacity:0;transition:opacity .5s}

/* ── NAV DOTS ── */
#ndots{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:400}
.nd{width:4px;height:4px;border-radius:50%;background:rgba(201,169,110,.22);border:1px solid rgba(201,169,110,.28);cursor:none;transition:all .4s ease}
.nd.on{background:var(--or);border-color:var(--or);box-shadow:0 0 8px rgba(201,169,110,.5)}

/* ── SCENE INFO ── */
#info{position:fixed;bottom:46px;left:0;right:52px;padding:0 38px;display:flex;justify-content:space-between;align-items:flex-end;z-index:400;pointer-events:none}
#rname{font-size:clamp(2rem,5.5vw,4.2rem);font-weight:normal;letter-spacing:.04em;color:var(--txt);opacity:0;transform:translateY(26px);transition:opacity .75s ease,transform .75s ease;line-height:1.05}
#rname.vis{opacity:1;transform:translateY(0)}
#mside{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:all}
#mtag{font-family:system-ui,sans-serif;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--or);opacity:0;transform:translateY(10px);transition:opacity .7s ease .18s,transform .7s ease .18s}
#mtag.vis{opacity:1;transform:translateY(0)}
#xbtn{padding:11px 24px;border:1px solid rgba(201,169,110,.4);background:rgba(6,4,2,.5);color:var(--or);font-family:system-ui,sans-serif;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;cursor:none;opacity:0;transform:translateY(10px);transition:opacity .7s ease .32s,transform .7s ease .32s,background .25s,border-color .25s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#xbtn.vis{opacity:1;transform:translateY(0)}
#xbtn:hover{background:rgba(201,169,110,.13);border-color:var(--or)}

/* ── SCROLL HINT ── */
#hint{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);text-align:center;z-index:400;pointer-events:none;transition:opacity .6s}
#hint p{font-family:system-ui,sans-serif;font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(201,169,110,.52);margin-bottom:12px}
.hl{width:1px;height:38px;background:linear-gradient(180deg,rgba(201,169,110,.7) 0%,transparent 100%);margin:0 auto;animation:hla 2.2s ease-in-out infinite}
@keyframes hla{0%,100%{opacity:.28;transform:translateY(0)}50%{opacity:1;transform:translateY(7px)}}

/* ── HERO CONTENT ── */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.hero h1{font-size:clamp(3rem,8vw,6.5rem);font-weight:normal;letter-spacing:.22em;text-transform:uppercase;text-align:center;line-height:.95;text-wrap:balance}
.hero p{font-family:system-ui,sans-serif;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--or);margin-top:22px}
.hero-line{width:50px;height:1px;background:var(--or);margin:20px auto 0;opacity:.5}

/* ── SCROLL TRACK ── */
#track{height:900vh;position:relative}
#stage{position:sticky;top:0;height:100vh;overflow:hidden}

/* ── SCENES ── */
.scene{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:opacity}
.si{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;will-change:transform}
.ov{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(6,4,2,.18) 0%,rgba(6,4,2,.08) 45%,rgba(6,4,2,.65) 100%)}
#s0 .ov{background:radial-gradient(ellipse at center,rgba(6,4,2,.28) 0%,rgba(6,4,2,.6) 100%)}

/* Mobile */
@media(max-width:700px){
  .hero h1{font-size:2.4rem}
  #rname{font-size:1.8rem}
  #info{right:0;padding:0 22px}
  #ndots{right:8px}
  #logo{left:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="cr"></div>
<div id="cd"></div>
<div id="pb"></div>

<div id="logo">
  <span id="logo-name">Maison Marcuzzi</span>
  <span id="logo-sub">Matériaux d'exception</span>
</div>

<div id="ctr"></div>

<div id="ndots">
  <div class="nd on" data-i="0"></div>
  <div class="nd" data-i="1"></div>
  <div class="nd" data-i="2"></div>
  <div class="nd" data-i="3"></div>
  <div class="nd" data-i="4"></div>
  <div class="nd" data-i="5"></div>
  <div class="nd" data-i="6"></div>
  <div class="nd" data-i="7"></div>
</div>

<div id="info">
  <div id="rname"></div>
  <div id="mside" style="display:none">
    <div id="mtag"></div>
    <button id="xbtn">Explorer ce matériau →</button>
  </div>
</div>

<div id="hint">
  <p>Faites défiler pour découvrir</p>
  <div class="hl"></div>
</div>

<div id="track">
 <div id="stage">

  <!-- 0 FAÇADE -->
  <div class="scene" id="s0">
    <img class="si" id="ext-img"
      src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=85"
      alt="Villa de luxe">
    <div class="ov"></div>
    <div class="hero">
      <h1>Maison<br>Marcuzzi</h1>
      <p>Matériaux d'exception</p>
      <div class="hero-line"></div>
    </div>
  </div>

  <!-- 1 HALL -->
  <div class="scene" id="s1">
    <img class="si"
      src="https://images.unsplash.com/photo-1600210492493-0977e98eb4c0?auto=format&fit=crop&w=1920&q=85"
      alt="Hall d'entrée">
    <div class="ov"></div>
  </div>

  <!-- 2 SALON -->
  <div class="scene" id="s2">
    <img class="si"
      src="https://images.unsplash.com/photo-1618219908412-a29a1bb7b86e?auto=format&fit=crop&w=1920&q=85"
      alt="Salon">
    <div class="ov"></div>
  </div>

  <!-- 3 CUISINE -->
  <div class="scene" id="s3">
    <img class="si"
      src="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?auto=format&fit=crop&w=1920&q=85"
      alt="Cuisine">
    <div class="ov"></div>
  </div>

  <!-- 4 SALLE DE BAIN -->
  <div class="scene" id="s4">
    <img class="si"
      src="https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?auto=format&fit=crop&w=1920&q=85"
      alt="Salle de bain">
    <div class="ov"></div>
  </div>

  <!-- 5 DRESSING -->
  <div class="scene" id="s5">
    <img class="si"
      src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1920&q=85"
      alt="Dressing">
    <div class="ov"></div>
  </div>

  <!-- 6 TERRASSE -->
  <div class="scene" id="s6">
    <img class="si"
      src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1920&q=85"
      alt="Terrasse">
    <div class="ov"></div>
  </div>

  <!-- 7 PISCINE -->
  <div class="scene" id="s7">
    <img class="si"
      src="https://images.unsplash.com/photo-1575429198097-0414ec08e8cd?auto=format&fit=crop&w=1920&q=85"
      alt="Espace piscine">
    <div class="ov"></div>
  </div>

 </div>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

const DATA = [
  { name:null, mat:null },
  { name:"Hall d'entrée", mat:'Carrelage marbre' },
  { name:'Salon',         mat:'Parquet chêne massif' },
  { name:'Cuisine',       mat:'Pierre & carrelage' },
  { name:'Salle de bain', mat:'Pierre naturelle' },
  { name:'Dressing',      mat:'Parquet & menuiserie' },
  { name:'Terrasse',      mat:'Dallage travertin' },
  { name:'Espace piscine',mat:'Margelle & carrelage piscine' },
];

const N       = DATA.length;
const scenes  = DATA.map((_,i)=>document.getElementById('s'+i));
const ndots   = document.querySelectorAll('.nd');
const pb      = document.getElementById('pb');
const track   = document.getElementById('track');
const extImg  = document.getElementById('ext-img');
const hint    = document.getElementById('hint');
const ctr     = document.getElementById('ctr');
const rname   = document.getElementById('rname');
const mside   = document.getElementById('mside');
const mtag    = document.getElementById('mtag');
const xbtn    = document.getElementById('xbtn');
let cur = -1;

/* ── CURSOR ── */
const cr = document.getElementById('cr');
const cd = document.getElementById('cd');
document.addEventListener('mousemove', e => {
  gsap.to(cd, { x:e.clientX-2.5, y:e.clientY-2.5, duration:.06 });
  gsap.to(cr, { x:e.clientX-23,  y:e.clientY-23,  duration:.55, ease:'power3.out' });
});
document.querySelectorAll('button,.nd').forEach(el=>{
  el.addEventListener('mouseenter',()=>gsap.to(cr,{width:62,height:62,duration:.35}));
  el.addEventListener('mouseleave',()=>gsap.to(cr,{width:46,height:46,duration:.35}));
});

/* ── ACTIVATE SCENE ── */
function activate(i) {
  if(i===cur) return;
  cur=i;
  ndots.forEach((d,j)=>d.classList.toggle('on',j===i));

  rname.classList.remove('vis');
  mtag.classList.remove('vis');
  xbtn.classList.remove('vis');
  void rname.offsetWidth;

  const d = DATA[i];
  if(d.name){
    ctr.textContent = String(i).padStart(2,'0')+' / 0'+(N-1);
    ctr.style.opacity='1';
    rname.textContent = d.name;
    mtag.textContent  = d.mat;
    mside.style.display='flex';
    setTimeout(()=>{ rname.classList.add('vis'); mtag.classList.add('vis'); xbtn.classList.add('vis'); },80);
  } else {
    ctr.style.opacity='0';
    rname.textContent='';
    mside.style.display='none';
  }
}

/* ── MAIN SCROLL ── */
ScrollTrigger.create({
  trigger:'#track', start:'top top', end:'bottom bottom',
  scrub: 1.4,
  onUpdate(self){
    const p = self.progress;

    // Progress bar
    gsap.set(pb,{scaleX:p});

    // Scroll hint fade
    gsap.set(hint,{opacity: Math.max(0, 1-p*14)});

    // Scenes crossfade
    const sp  = p * N;
    const idx = Math.min(Math.floor(sp), N-1);
    const lp  = sp - idx;

    scenes.forEach((s,i)=>{
      let op=0;
      if(i===idx){
        op = lp<.07 ? lp/.07 : lp>.9 ? 1-(lp-.9)/.1 : 1;
      } else if(i===idx+1 && lp>.9){
        op=(lp-.9)/.1;
      }
      gsap.set(s,{opacity:op,force3D:true});
    });

    // Exterior approach zoom (scene 0 only)
    if(idx===0){
      gsap.set(extImg,{scale:1+lp*1.5,transformOrigin:'center center',force3D:true});
    }

    activate(idx);
  }
});

/* ── DOT NAV ── */
ndots.forEach((d,i)=>{
  d.addEventListener('click',()=>{
    const max=track.offsetHeight-window.innerHeight;
    window.scrollTo({top:(i/N)*max+(max/N*.08), behavior:'smooth'});
  });
});

/* ── EXPLORE ── */
xbtn.addEventListener('click',()=>{
  if(DATA[cur]?.mat) alert('Page : '+DATA[cur].mat+'\n(À relier à la vraie catégorie)');
});

/* ── INIT ── */
scenes[0].style.opacity='1';
activate(0);
</script>
</body>
</html>
